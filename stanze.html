<style>
:root{--bg:#150d10;--surface:rgba(40,25,30,.88);--fg:#f6ecee;--muted:#b9a0a7;--line:rgba(255,255,255,.13);--accent:#ff5a5f;--ok:#4cc38a;--sheet:#24161b;--glass:rgba(21,13,16,.82);--wm:.10;color-scheme:dark;--fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--fb:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}

.in{width:100%;height:44px;border-radius:13px;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 5%,transparent);padding:0 14px;font-size:16px;margin-bottom:14px}

.go.load::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.35) 50%,transparent 80%);animation:sh 1s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.go.dan{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}.go.dan.arm{background:var(--accent);color:#fff}
.go.sec{background:transparent;border:1px solid var(--line);color:var(--fg);margin-top:8px}
.who{margin-top:22px;border:1px solid var(--line);border-radius:20px;padding:18px;background:var(--surface);animation:pop .5s var(--spring)}

.burst svg{width:58px;height:58px;fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:ck .45s .25s var(--ease) forwards}
.burst::before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid var(--ok);animation:ring .9s .1s var(--ease) forwards}
.burst .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);animation:dt .9s .2s var(--ease) forwards;opacity:0}
@keyframes bst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.08);opacity:1}40%{transform:scale(1)}80%{opacity:1}100%{transform:scale(.9);opacity:0}}
@keyframes ck{to{stroke-dashoffset:0}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.3);opacity:0}}
@keyframes dt{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font:700 .85rem var(--fb);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--spring);z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

</style>

<body>
<div class="wrap">

<script>
(function(){
var Q=new URLSearchParams(location.search);
if(Q.get('th')==='dark'||Q.get('th')==='light')document.documentElement.setAttribute('data-th',Q.get('th'));
if(Q.get('app')==='1'){document.body.classList.add('app');document.getElementById('stk').insertBefore(document.getElementById('top'),document.getElementById('stk').firstChild)}
var SB='https://zcykviesiinezzuyoprn.supabase.co/rest/v1/rpc/',K='sb_publishable_NCMbolO_pS9v6EWQsoGEbw_c11nlTUL',TEAM='ufficio-natalucci';
var ROOMS=['Sala Riunioni','Sala Gianni','Aquario 5','Sala Civico 5'],R0=480,R1=1260,H=40,NDAYS=21,LEFT=52;
var COL=['#ff5a5f','#f2a33a','#4cc38a','#4aa8e8','#9b7be8','#e86fb0','#2fc4c4','#c9b037'];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function rpc(fn,a){return fetch(SB+fn,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null})})}
function col(n){var h=0,s=String(n).toLowerCase();for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COL[h%COL.length]}
function fmt(m){return('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)}

function lab(s){return pd(s).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
var tT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on')},2200)}

var name=(Q.get('n')||store('stanze_nome')||'').trim(),day=today(),room=0,all=[],sel=null,info=null,sheetOpen=false,fresh={},lastKey='';
var NS=(R1-R0)/30;

function load(cb){rpc('jr_list',{p_team:TEAM}).then(function(rows){all=(rows||[]).filter(function(r){return r.data&&r.data.tipo==='room'}).map(function(r){var q=r.data;return{id:r.id,o:r.owner,room:+q.room,d:q.d,s:mins(q.t),e:mins(q.e),what:q.note||''}});cb&&cb()}).catch(function(){toast('Non riesco a leggere le prenotazioni');cb&&cb()})}
function dayList(d){return all.filter(function(r){return r.d===(d||day)})}
function roomList(){return dayList().filter(function(r){return r.room===room})}
function isFree(rm,s,e){return!dayList().some(function(r){return r.room===rm&&r.s<e&&s<r.e})}
function nowM(){var n=new Date();return n.getHours()*60+n.getMinutes()}

/* giorni */
function buildDays(){
  var h='',t=new Date();
  for(var i=0;i<NDAYS;i++){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i),s=iso(d);
    h+='<button type="button" class="d" data-d="'+s+'"><small>'+(i===0?'oggi':d.toLocaleDateString('it-IT',{weekday:'short'}).replace('.',''))+'</small><b>'+d.getDate()+'</b><i></i></button>'}
  $('days').innerHTML=h;
}
function markDays(scroll){
  var els=$('days').children;
  for(var i=0;i<els.length;i++){var s=els[i].getAttribute('data-d');els[i].classList.toggle('on',s===day);els[i].classList.toggle('has',dayList(s).length>0)}
  if(scroll){var on=$('days').querySelector('.on');if(on){var c=$('days');c.scrollTo({left:on.offsetLeft-c.clientWidth/2+on.offsetWidth/2,behavior:scroll==='fast'?'auto':'smooth'})}}
}
function buildTabs(){
  $('tabs').innerHTML=ROOMS.map(function(n,i){return'<button type="button" class="t" data-r="'+i+'"><i></i>'+esc(n)+'</button>'}).join('');
}
function markTabs(){
  var isT=day===today(),nm=nowM(),els=$('tabs').children;
  for(var i=0;i<els.length;i++){
    var busy=isT&&dayList().some(function(r){return r.room===i&&r.s<=nm&&nm<r.e});
    els[i].classList.toggle('on',i===room);els[i].classList.toggle('busy',busy);
  }
}
function markStat(){
  var l=roomList().sort(function(a,b){return a.s-b.s}),isT=day===today(),nm=nowM(),h;
  if(isT){var cur=l.filter(function(r){return r.s<=nm&&nm<r.e})[0];
    if(cur)h='<b>'+esc(ROOMS[room])+'</b> è <span class="bad">occupata</span> fino alle '+fmt(cur.e)+' · '+esc(cur.o.split(' ')[0]);
    else{var nx=l.filter(function(r){return r.s>nm})[0];h='<b>'+esc(ROOMS[room])+'</b> è <span class="ok">libera ora</span>'+(nx?' fino alle '+fmt(nx.s):' per il resto della giornata')}}
  else h=l.length?'<b>'+esc(ROOMS[room])+'</b> · '+l.length+(l.length===1?' prenotazione':' prenotazioni'):'<b>'+esc(ROOMS[room])+'</b> è <span class="ok">libera tutto il giorno</span>';
  $('stat').innerHTML=h+'<span class="tip">Tocca una fascia libera per prenotare</span><div class="bar" id="bar"></div><div class="bsc"><span style="left:2%">8</span><span style="left:23%">11</span><span style="left:46%">14</span><span style="left:69%">17</span><span style="left:92%">20</span></div>';
}

/* elenco */
function ini(n){var p=String(n).trim().split(/\s+/);return((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase()}
function dlab(x){return x<60?x+' min':x===60?'1 ora':x===90?'1 ora e mezza':(x%60?Math.floor(x/60)+' ore e mezza':(x/60)+' ore')}
function segs(){
  var l=roomList().sort(function(a,b){return a.s-b.s}),out=[],cur=R0,isT=day===today(),lim=isT?Math.ceil(nowM()/30)*30:R0;
  l.forEach(function(r){if(r.s>cur)out.push({free:1,s:cur,e:r.s});out.push({b:r});cur=Math.max(cur,r.e)});
  if(cur<R1)out.push({free:1,s:cur,e:R1});
  return out.map(function(x){if(x.free){x.s=Math.max(x.s,lim);if(x.e-x.s<30)return null}return x}).filter(Boolean);
}
function cardHtml(x,i,fr){
  var dl=' style="--dl:'+(Math.min(Math.max(i,0),8)*.05)+'s'+(x.b?';--c:'+col(x.b.o):'')+'"',an=i>=0?' in':'';
  if(x.free)return'<button type="button" class="cd fr'+an+'" data-g="'+x.s+'-'+x.e+'"'+dl+'><span class="ic">+</span><span class="tx"><b>'+fmt(x.s)+' – '+fmt(x.e)+'</b><small>Libera · '+dlab(x.e-x.s)+'</small></span><span class="go2">Prenota</span></button>';
  var r=x.b,mine=r.o.toLowerCase()===name.toLowerCase();
  return'<button type="button" class="cd bz'+an+(fr&&fr[r.id]?' new':'')+'" data-b="'+esc(r.id)+'"'+dl+'><span class="ic">'+esc(ini(r.o))+'</span><span class="tx"><b>'+esc(r.o)+'</b><small>'+fmt(r.s)+' – '+fmt(r.e)+(r.what?' · '+esc(r.what):'')+'</small></span>'+(mine?'<span class="me">Tua</span>':'')+'</button>';
}
function markBar(){
  var l=roomList(),tot=R1-R0,h='';
  l.forEach(function(r){h+='<i style="left:'+((Math.max(r.s,R0)-R0)/tot*100)+'%;width:'+((Math.min(r.e,R1)-Math.max(r.s,R0))/tot*100)+'%;--c:'+col(r.o)+'"></i>'});
  if(day===today()){var n=nowM();if(n>=R0&&n<R1)h+='<u style="left:'+((n-R0)/tot*100)+'%"></u>'}
  var b=$('bar');if(b)b.innerHTML=h;
}
function renderList(dir,anim){
  var key=day+'|'+room,changed=key!==lastKey;lastKey=key;
  var box=$('lst'),sg=segs(),f=fresh;fresh={};
  var html=sg.length?sg.map(function(x,i){return cardHtml(x,changed||anim?i:-1,f)}).join(''):'<p class="empty">Nessun orario disponibile oggi</p>';
  if(html!==box._h||changed||anim){box.innerHTML=html;box._h=html}
}
function renderAll(dir){
  var box=$('lst');
  function go(){markDays(dir?'smooth':false);markTabs();markStat();markBar();renderList(dir,!!dir)}
  if(dir){box.classList.add('out',dir);setTimeout(function(){go();box.classList.remove('out');setTimeout(function(){box.classList.remove('l','r')},10)},160)}
  else go();
}

/* sheet */
function openSheet(html){var sh=$('sheet');sh.innerHTML='<div class="grab"></div>'+html;sh.classList.add('on');$('scrim').classList.add('on');sheetOpen=true}
function closeSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on');sheetOpen=false;sel=null;info=null}
function maxDur(){return sel.ge-sel.s}
function durOpts(){return[30,60,90,120,180,240].filter(function(x){return x<=maxDur()})}
function pickGap(g){
  var p=g.split('-'),gs=+p[0],ge=+p[1];if(sheetOpen)return;
  info=null;sel={gs:gs,ge:ge,s:gs,dur:60};
  if(sel.dur>maxDur())sel.dur=durOpts().slice(-1)[0]||30;
  var st='';for(var m=gs;m<=ge-30;m+=30)st+='<button type="button" class="c" data-st="'+m+'">'+fmt(m)+'</button>';
  vib(8);
  openSheet('<h2>'+esc(ROOMS[room])+'</h2><p class="when">'+esc(lab(day))+'</p><div class="range" id="rg"></div><p class="lab">DALLE</p><div class="chips sc" id="cs">'+st+'</div><p class="lab">PER QUANTO</p><div class="chips" id="ch"></div><input class="in" id="tit" placeholder="Per cosa? (facoltativo)" autocomplete="off" maxlength="40"><button type="button" class="go" id="go">Prenota</button>');
  upSheet(false);
  var on=$('cs').querySelector('.on');if(on)$('cs').scrollLeft=on.offsetLeft-16;
}
function upSheet(bump){
  var rg=$('rg');if(!rg||!sel)return;
  var o=durOpts();if(o.indexOf(sel.dur)<0)sel.dur=o.indexOf(60)>=0?60:o[o.length-1];
  rg.textContent=fmt(sel.s)+' – '+fmt(sel.s+sel.dur);
  $('ch').innerHTML=o.map(function(x){return'<button type="button" class="c'+(x===sel.dur?' on':'')+'" data-dur="'+x+'">'+dlab(x)+'</button>'}).join('');
  [].forEach.call($('cs').children,function(c){c.classList.toggle('on',+c.getAttribute('data-st')===sel.s)});
  if(bump){rg.classList.add('bump');setTimeout(function(){rg.classList.remove('bump')},180)}
}
function showInfo(id){
  var r=all.filter(function(x){return x.id===id})[0];if(!r||sheetOpen)return;sel=null;info={id:id,armed:false};
  var mine=r.o.toLowerCase()===name.toLowerCase();
  openSheet('<h2>'+esc(ROOMS[r.room])+'</h2><p class="when">'+esc(lab(r.d))+'</p><div class="range">'+fmt(r.s)+' – '+fmt(r.e)+'</div><p style="margin:0 0 14px"><b>'+esc(r.o)+'</b>'+(r.what?' · '+esc(r.what):'')+'</p>'+(mine?'<button type="button" class="go dan" id="rel">Libera la stanza</button>':'')+'<button type="button" class="go sec" id="cl">Chiudi</button>');
}
function burst(){
  var fx=$('fx'),c=col(name),dots='';
  for(var i=0;i<10;i++){var a=i/10*6.283,r=90+Math.random()*30;dots+='<span class="dot" style="--c:'+COL[i%COL.length]+';--x:'+Math.round(Math.cos(a)*r)+'px;--y:'+Math.round(Math.sin(a)*r)+'px"></span>'}
  fx.innerHTML='<div class="burst">'+dots+'<svg viewBox="0 0 52 52"><path d="M14 27l8 8 16-17"/></svg></div>';
  setTimeout(function(){fx.innerHTML=''},1300);vib([14,40,18]);
}
function book(){
  var s0=sel;if(!s0)return;var tit=($('tit').value||'').trim(),go=$('go'),e=s0.s+s0.dur,rm=room,dy=day;
  go.disabled=true;go.classList.add('load');go.textContent='Prenoto…';
  load(function(){
    if(!isFree(rm,s0.s,e)){go.classList.remove('load');go.disabled=false;go.textContent='Prenota';toast('Appena occupata da un collega');closeSheet();renderAll();return}
    var id='rm_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    rpc('jr_put',{p_team:TEAM,p_id:id,p_owner:name,p_data:{tipo:'room',room:rm,d:dy,t:fmt(s0.s),e:fmt(e),note:tit,tit:ROOMS[rm]+(tit?' · '+tit:'')}}).then(function(){
      all.push({id:id,o:name,room:rm,d:dy,s:s0.s,e:e,what:tit});fresh[id]=1;
      $('sheet').classList.remove('on');$('scrim').classList.remove('on');sheetOpen=false;sel=null;
      setTimeout(function(){renderAll();burst();toast('Stanza prenotata')},180);
    }).catch(function(){go.classList.remove('load');go.disabled=false;go.textContent='Prenota';toast('Non riuscito, riprova')});
  });
}
function release(){
  var id=info&&info.id;if(!id)return;var r=all.filter(function(x){return x.id===id})[0];
  rpc('jr_del',{p_team:TEAM,p_id:id,p_owner:name}).then(function(){
    all=all.filter(function(x){return x.id!==id});closeSheet();setTimeout(function(){renderAll();toast('Stanza liberata');vib(12)},120);
  }).catch(function(){toast('Non riuscito, riprova')});
}

document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('button,.scrim');if(!t)return;
  if(t.id==='scrim'||t.classList.contains('scrim')||t.id==='cl'){closeSheet();return}
  if(t.hasAttribute('data-d')){var nd=t.getAttribute('data-d');if(nd===day)return;var dir=nd>day?'l':'r';day=nd;sel=null;info=null;if(sheetOpen)closeSheet();renderAll(dir);window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.hasAttribute('data-r')&&t.parentNode.id==='tabs'){var nr=+t.getAttribute('data-r');if(nr===room)return;var d2=nr>room?'l':'r';room=nr;if(sheetOpen)closeSheet();renderAll(d2);return}
  if(t.hasAttribute('data-g')){pickGap(t.getAttribute('data-g'));return}
  if(t.hasAttribute('data-st')){sel.s=+t.getAttribute('data-st');upSheet(true);vib(6);return}
  if(t.hasAttribute('data-b')){if(!sheetOpen)showInfo(t.getAttribute('data-b'));return}
  if(t.hasAttribute('data-dur')){sel.dur=+t.getAttribute('data-dur');upSheet(true);vib(6);return}
  if(t.id==='xcl'){try{parent.postMessage('stanze-close','*')}catch(e){}return}
  if(t.id==='go'){book();return}
  if(t.id==='rel'){if(!info.armed){info.armed=true;t.classList.add('arm');t.textContent='Tocca ancora per liberare'}else release();return}
});
/* swipe orizzontale sulla timeline = cambia stanza */
var sx=0,sy=0;
$('lst').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('lst').addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(sheetOpen||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;var nr=room+(dx<0?1:-1);if(nr<0||nr>=ROOMS.length)return;room=nr;renderAll(dx<0?'l':'r')},{passive:true});

function askName(){
  $('main').hidden=true;$('sub').textContent='Prenota una sala in pochi tocchi';
  $('ask').innerHTML='<div class="who"><label for="nm">Come ti chiami? (nome e cognome)</label><input class="in" id="nm" autocomplete="name" placeholder="Es. Mario Rossi"><button type="button" class="go" id="nmok">Continua</button></div>';
  $('nmok').onclick=function(){var v=$('nm').value.trim();if(v.length<2){toast('Scrivi il tuo nome');return}name=v;store('stanze_nome',v);$('ask').innerHTML='';main()};
}
function main(){
  $('sub').innerHTML='Ciao '+esc(name.split(' ')[0])+(Q.get('n')?'':' · <button type="button" id="chg">Non sei tu?</button>');
  var c=$('chg');if(c)c.onclick=function(){store('stanze_nome','');name='';askName()};
  $('main').hidden=false;lastKey='';
  buildDays();buildTabs();renderAll(null);markDays('fast');
  load(function(){renderAll();markDays(false)});
}
setInterval(function(){if(name&&!sheetOpen&&!document.hidden)load(function(){renderAll();markDays(false)})},20000);
setInterval(function(){if(name&&!document.hidden&&!sheetOpen){renderAll()}},60000);
document.addEventListener('visibilitychange',function(){if(name&&!document.hidden&&!sheetOpen)load(function(){renderAll();markDays(false)})});
if(name)main();else askName();
})();
</script>
