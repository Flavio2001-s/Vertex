<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c4161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stanze">
<link rel="apple-touch-icon" href="icon-v2.png">
<title>Stanze ufficio</title>
<style>
:root{--bg:#150d10;--surface:#24161b;--fg:#f6ecee;--muted:#b9a0a7;--line:rgba(255,255,255,.13);--accent:#ff5a5f;--ok:#4cc38a;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#fbf5f5;--surface:#fff;--fg:#2a1519;--muted:#7d5f66;--line:rgba(0,0,0,.12);--accent:#c4161c;--ok:#1f8a58;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto;min-height:100vh}
h1{font-size:1.5rem;margin:6px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.sub button{all:unset;color:var(--accent);font-weight:700;cursor:pointer}
button,input,select{font:inherit;color:inherit}
.nav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.nav b{flex:1;text-align:center;font-size:1rem;text-transform:capitalize}
.nav button{min-width:42px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:1.2rem}
.nav .oggi{font-size:.8rem;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.st{border-radius:14px;padding:9px 11px;border:1px solid var(--line);background:var(--surface)}
.st b{display:block;font-size:.85rem}.st small{display:block;font-size:.72rem;color:var(--muted);margin-top:2px;line-height:1.25}
.st.free{border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}.st.free small{color:var(--ok)}
.st.busy{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.head,.g{display:grid;grid-template-columns:34px repeat(4,minmax(0,1fr));gap:4px}
.head{font-size:.68rem;font-weight:700;color:var(--muted);text-align:center;margin-bottom:5px;line-height:1.1;overflow-wrap:anywhere;align-items:end}
.sc{max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px;overscroll-behavior:contain}
.times{position:relative}.times span{position:absolute;right:4px;font-size:.62rem;font-weight:700;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-radius:10px;background:color-mix(in srgb,var(--fg) 5%,transparent);overflow:hidden}
.slot{display:block;width:100%;height:28px;margin:0;border:0;border-top:1px dashed color-mix(in srgb,var(--fg) 12%,transparent);background:transparent;padding:0;border-radius:0}
.slot.past{opacity:.35}.slot.sel{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.blk{position:absolute;left:2px;right:2px;margin:0;border:0;border-left:3px solid var(--c);border-radius:8px;padding:3px 5px;text-align:left;font-size:.66rem;line-height:1.15;font-weight:700;color:var(--fg);background:color-mix(in srgb,var(--c) 30%,var(--surface));overflow:hidden}
.blk small{display:block;font-weight:600;opacity:.85;font-size:.6rem}
.panel{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);display:grid;gap:12px}
label{display:grid;gap:5px;font-size:.78rem;color:var(--muted);font-weight:600}
input,select{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.act{display:flex;gap:8px}.act button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;font-weight:800}
.act .pri{background:var(--accent);border-color:transparent;color:#fff}.act .dan{color:var(--accent)}
.hint{color:var(--muted);font-size:.8rem;text-align:center;margin:12px 0 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.who{display:grid;gap:12px;margin-top:30px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<h1>Stanze ufficio</h1>
<p class="sub" id="sub"></p>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
(function(){
var SB='https://zcykviesiinezzuyoprn.supabase.co/rest/v1/rpc/', K='sb_publishable_NCMbolO_pS9v6EWQsoGEbw_c11nlTUL', TEAM='ufficio-natalucci';
var ROOMS=['Sala Riunioni','Sala Gianni','Aquario 5','Sala Civico 5'], R0=480, R1=1260, H=28;
var COL=['#ff5a5f','#f2a33a','#4cc38a','#4aa8e8','#9b7be8','#e86fb0','#2fc4c4','#c9b037'];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function rpc(fn,a){return fetch(SB+fn,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(a)}).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null})})}
function col(n){var h=0,s=String(n).toLowerCase();for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COL[h%COL.length]}
function fmt(m){return('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)}
function mins(t){var p=String(t).split(':');return(+p[0])*60+(+p[1]||0)}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function today(){return iso(new Date())}
function shift(d,n){var p=d.split('-'),x=new Date(+p[0],+p[1]-1,+p[2]);x.setDate(x.getDate()+n);return iso(x)}
function label(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.className='on';clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},2200)}

var name=store('stanze_nome')||'', day=today(), all=[], sel=null, info=null, first=true;
function load(cb){rpc('jr_list',{p_team:TEAM}).then(function(rows){all=(rows||[]).filter(function(r){return r.data&&r.data.tipo==='room'}).map(function(r){var q=r.data;return{id:r.id,o:r.owner,room:+q.room,d:q.d,s:mins(q.t),e:mins(q.e),what:q.note||''}});cb&&cb()}).catch(function(){toast('Non riesco a leggere le prenotazioni');cb&&cb()})}
function list(){return all.filter(function(r){return r.d===day})}
function free(room,s,e){return!list().some(function(r){return r.room===room&&r.s<e&&s<r.e})}

function askName(){
  $('sub').textContent='';
  $('app').innerHTML='<div class="who panel"><label for="nm">Come ti chiami? (nome e cognome)<input id="nm" autocomplete="name" placeholder="Es. Mario Rossi"></label><div class="act"><button class="pri" id="nmok" type="button">Continua</button></div></div>';
  $('nmok').onclick=function(){var v=$('nm').value.trim();if(v.length<2){toast('Scrivi il tuo nome');return}name=v;store('stanze_nome',v);main()};
}
function inner(){
  var now=new Date(),nowM=now.getHours()*60+now.getMinutes(),isT=day===today(),l=list(),n=(R1-R0)/30;
  var h='<div class="nav"><button type="button" data-n="-1" aria-label="Giorno precedente">‹</button><b>'+esc(label(day))+'</b><button type="button" data-n="1" aria-label="Giorno successivo">›</button>'+(isT?'':'<button type="button" class="oggi" data-n="0">Oggi</button>')+'</div>';
  h+='<div class="stats">'+ROOMS.map(function(nm,i){var c=isT&&l.filter(function(r){return r.room===i&&r.s<=nowM&&nowM<r.e})[0];return'<div class="st '+(c?'busy':'free')+'"><b>'+esc(nm)+'</b><small>'+(c?'Occupata fino alle '+fmt(c.e)+' · '+esc(c.o.split(' ')[0]):(isT?'Libera ora':'Libera'))+'</small></div>'}).join('')+'</div>';
  h+='<div class="head"><span></span>'+ROOMS.map(function(x){return'<span>'+esc(x)+'</span>'}).join('')+'</div><div class="sc" id="sc"><div class="g"><div class="times" style="height:'+n*H+'px">';
  for(var m=R0;m<R1;m+=60)h+='<span style="top:'+((m-R0)/30*H+(m===R0?8:0))+'px">'+fmt(m)+'</span>';
  h+='</div>';
  ROOMS.forEach(function(nm,ri){
    h+='<div class="col" style="height:'+n*H+'px">';
    for(var m2=R0;m2<R1;m2+=30){var past=isT&&m2+30<=nowM,on=sel&&sel.room===ri&&m2>=sel.s&&m2<sel.s+(sel.dur||30);h+='<button type="button" class="slot'+(past?' past':'')+(on?' sel':'')+'" data-r="'+ri+'" data-s="'+m2+'" aria-label="'+esc(nm)+' '+fmt(m2)+'"></button>'}
    l.filter(function(r){return r.room===ri}).forEach(function(r){var top=(Math.max(r.s,R0)-R0)/30*H,ht=(Math.min(r.e,R1)-Math.max(r.s,R0))/30*H-2;h+='<button type="button" class="blk" data-b="'+esc(r.id)+'" style="top:'+top+'px;height:'+ht+'px;--c:'+col(r.o)+'"><b>'+esc(r.o.split(' ')[0])+'</b>'+(r.what?'<small>'+esc(r.what)+'</small>':'')+'</button>'});
    h+='</div>';
  });
  h+='</div></div>';
  if(sel){
    var s=sel.s,nx=R1;l.forEach(function(r){if(r.room===sel.room&&r.s>=s&&r.s<nx)nx=r.s});
    var mx=nx-s,o=[30,60,90,120,180,240].filter(function(x){return x<=mx}),df=o.indexOf(60)>=0?60:o[o.length-1];
    h+='<div class="panel"><b>'+esc(ROOMS[sel.room])+' · dalle '+fmt(s)+'</b><label for="dur">Per quanto<select id="dur">'+o.map(function(x){return'<option value="'+x+'"'+(x===df?' selected':'')+'>'+(x<60?x+' minuti':(x/60)+(x===60?' ora':' ore')+' (fino alle '+fmt(s+x)+')')+'</option>'}).join('')+'</select></label><label for="tit">Per cosa (facoltativo)<input id="tit" placeholder="Es. Colloquio, riunione" autocomplete="off"></label><div class="act"><button type="button" id="can">Annulla</button><button type="button" class="pri" id="ok">Prenota</button></div></div>';
  } else if(info){
    var r2=all.filter(function(r){return r.id===info.id})[0];
    if(r2){var mine=r2.o.toLowerCase()===name.toLowerCase();h+='<div class="panel"><b>'+esc(ROOMS[r2.room])+' · '+fmt(r2.s)+'–'+fmt(r2.e)+'</b><span class="hint" style="margin:0;text-align:left">Prenotata da <b>'+esc(r2.o)+'</b>'+(r2.what?' · '+esc(r2.what):'')+'</span><div class="act"><button type="button" id="can">Chiudi</button>'+(mine?'<button type="button" class="dan" data-del="'+esc(r2.id)+'">'+(info.c?'Tocca ancora per liberare':'Libera la stanza')+'</button>':'')+'</div></div>'}
  } else h+='<p class="hint">Tocca un orario libero per prenotare. Con le frecce scegli un altro giorno.</p>';
  return h;
}
function draw(){
  var sc=$('sc'),top=sc?sc.scrollTop:null;
  $('app').innerHTML=inner();sc=$('sc');if(!sc)return;
  if(top!==null&&!first)sc.scrollTop=top;else{var n=new Date(),m=day===today()?Math.max(R0,n.getHours()*60+n.getMinutes()-30):540;sc.scrollTop=(m-R0)/30*H;first=false}
}
function book(){
  var dur=+($('dur')||{}).value,tit=(($('tit')||{}).value||'').trim(),s0=sel;if(!s0||!dur)return;
  var e=s0.s+dur,ok=$('ok');if(ok)ok.disabled=true;
  load(function(){
    if(!free(s0.room,s0.s,e)){toast('Appena occupata da un collega');sel=null;draw();return}
    var id='rm_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    rpc('jr_put',{p_team:TEAM,p_id:id,p_owner:name,p_data:{tipo:'room',room:s0.room,d:day,t:fmt(s0.s),e:fmt(e),note:tit,tit:ROOMS[s0.room]+(tit?' · '+tit:'')}}).then(function(){toast('Stanza prenotata');sel=null;load(draw)}).catch(function(){toast('Prenotazione non riuscita, riprova');if(ok)ok.disabled=false});
  });
}
function del(id){
  if(!info||!info.c){info={id:id,c:true};draw();return}
  rpc('jr_del',{p_team:TEAM,p_id:id,p_owner:name}).then(function(){toast('Stanza liberata');info=null;load(draw)}).catch(function(){toast('Non riuscito, riprova')});
}
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('button');if(!t||!$('app').contains(t))return;
  if(t.hasAttribute('data-n')){var n=+t.getAttribute('data-n');day=n?shift(day,n):today();sel=null;info=null;first=true;draw();return}
  if(t.classList.contains('slot')){var s=+t.getAttribute('data-s'),r=+t.getAttribute('data-r'),nw=new Date();if(day===today()&&s+30<=nw.getHours()*60+nw.getMinutes()){toast('Orario già passato');return}sel={room:r,s:s,dur:60};info=null;draw();return}
  if(t.hasAttribute('data-b')){info={id:t.getAttribute('data-b')};sel=null;draw();return}
  if(t.id==='can'){sel=null;info=null;draw();return}
  if(t.id==='ok'){book();return}
  if(t.hasAttribute('data-del')){del(t.getAttribute('data-del'));return}
});
function main(){
  $('sub').innerHTML='Ciao '+esc(name.split(' ')[0])+' · <button type="button" id="chg">Non sei tu?</button>';
  $('chg').onclick=function(){store('stanze_nome','');name='';askName()};
  first=true;draw();load(draw);
}
setInterval(function(){if(name&&!sel&&!document.hidden)load(draw)},20000);
document.addEventListener('visibilitychange',function(){if(name&&!document.hidden&&!sel)load(draw)});
if(name)main();else askName();
})();
</script>
</body>
</html>
