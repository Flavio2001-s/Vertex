  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--glass-line);border-radius:22px 22px 0 0;box-shadow:0 -6px 18px rgba(7,90,100,.08)}
#tabs button{display:grid;justify-items:center;gap:3px;border:0;background:transparent;border-radius:16px;padding:7px 0;font-size:.68rem;font-weight:700;color:var(--muted)}
#tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
</style>
<style>
#party{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;overflow:hidden;background:rgba(5,30,36,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pcard{position:relative;width:100%;max-width:340px;text-align:center;display:grid;gap:10px;justify-items:center;padding:26px 20px 20px;border-radius:28px;background:var(--sheet);border:1px solid var(--glass-line);box-shadow:0 20px 50px rgba(0,0,0,.28);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.pbadge{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#0fb0b5,#1b8fd6);box-shadow:0 8px 20px rgba(15,176,181,.4)}
.pbadge.sun{background:linear-gradient(135deg,#ffb020,#ff7a1a);box-shadow:0 8px 20px rgba(255,140,30,.4)}
.pbadge svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pcard h2{margin:6px 0 0;font-family:var(--font-display);font-size:1.35rem;text-wrap:balance}
.pmsg{margin:0;color:var(--fg);line-height:1.45;text-wrap:pretty}
.pnum{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;line-height:1.5}
.pprov{width:100%;display:grid;gap:5px;text-align:left;margin-top:2px}
.pprov span{font-size:.78rem;color:var(--muted);min-height:1.1em}
.pprov i{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pprov i::after{content:"";display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ffb020,#ff7a1a);animation:fillp 3.2s ease-out forwards}
.mon{position:absolute;top:-40px;opacity:0;animation:rain linear both;pointer-events:none}
.mon.coin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#ffe27a,#f2a900);color:#8a5200;font:800 14px/1 var(--font-display);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.mon.note{width:42px;height:22px;border-radius:4px;background:linear-gradient(135deg,#5fd08a,#2e9e5b);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.mon.note::after{content:"";position:absolute;inset:5px 14px;border-radius:50%;background:rgba(255,255,255,.45)}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(12px)}to{opacity:1;transform:none}}
@keyframes rain{0%{opacity:0;transform:translate(0,0) rotate(0)}8%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translate(var(--sw,0),105vh) rotate(720deg)}}
@keyframes fillp{to{width:92%}}
.mon.emo{font-size:24px;line-height:1}
.pbadge.wave{position:relative;font:800 1.9rem/1 var(--font-display);color:#fff;animation:pbounce .8s .3s cubic-bezier(.3,1.6,.5,1) both}
.pbadge.wave b{font-weight:800}
.pbadge .hand{position:absolute;right:-12px;top:-10px;font-style:normal;font-size:1.9rem;transform-origin:70% 70%;animation:waveh 1s .6s ease-in-out 2}
@keyframes waveh{0%,100%{transform:rotate(0)}20%{transform:rotate(22deg)}40%{transform:rotate(-14deg)}60%{transform:rotate(20deg)}80%{transform:rotate(-8deg)}}
@keyframes pbounce{0%{transform:scale(.4)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pbadge.wave,.pbadge .hand{animation:none}}
@media (prefers-reduced-motion:reduce){.pcard{animation:none}.mon{display:none}.pprov i::after{animation:none;width:92%}}

.joke{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:5px;line-height:1.35;max-width:30ch}
</style>
<script>
/* ===== MESSAGGIO DI FESTA QUANDO AGGIUNGI UNA POLIZZA ===== */
const JOKES = {
  general:[
    'Provvigione in arrivo. I tempi sono quelli dell’amministrazione, ma arriva.',
    'Il tuo conto in banca ha sentito la notizia e si è emozionato.',
    'Un’altra polizza, un altro passo verso la macchina nuova. O almeno verso il bollo.',
    'Pioggia di monete in corso: la contabilità ha ricevuto il preavviso.',
    'Firmata! Adesso la sfortuna deve prendere appuntamento.',
    'Il cliente è coperto. La tua provvigione è in coda, ma coperta anche lei.'
  ],
  big:[
    'Con questi numeri anche la banca ti saluta per nome.',
    'Provvigione di quelle che si notano: prepara il caffè per tutta l’agenzia.',
    'Questa la racconti per mesi. E il commercialista pure.'
  ],
  neg:[
    'Storno: la provvigione fa un passo indietro, tu ne fai due avanti.',
    'Qualche euro torna al mittente. Torna anche la voglia di recuperare.',
    'Capita ai migliori. Poi si riparte più forte.'
  ],
  PROT:[
    'Protection: hai venduto serenità. Il cliente ringrazia, la provvigione pure.',
    'Temporanea caso morte: il cliente è tranquillo. Tu lo sarai quando arriva la provvigione.',
    'Long term care: pensi al futuro del cliente. E, ogni tanto, anche al tuo.',
    'Il cliente ha pagato per non usarla mai. Il miglior affare del mondo.'
  ],
  PU:[
    'Premio unico: tutto in un colpo. La provvigione fa un respiro profondo.',
    'Investimento fatto: il cliente guarda il rendimento, tu guardi l’estratto conto.',
    'Con un premio così anche il commercialista sorride.'
  ],
  RIC:[
    'PAC e PIP: i piccoli versamenti diventano grandi. Come le tue provvigioni, col tempo.',
    'Ricorrente: un cliente che paga ogni anno è un amico per sempre.',
    'Poco alla volta, per sempre. La pazienza paga, anche se in rate.'
  ],
  DNA:[
    'Danni non auto: il cliente dorme tranquillo, il tubo dell’acqua pure.',
    'Il giorno in cui servirà, ti vorrà molto bene.',
    'Pronti per grandine, perdite d’acqua e vicino distratto.'
  ],
  WEL:['Welfare: la salute dei clienti è in buone mani. La tua provvigione, in buona attesa.']
};
const PICON = {
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M8.5 12l2.4 2.4L15.5 9.5"/>',
  star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8L12 3.5z"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  bolt:'<path d="M13 3L5.5 13H11l-1 8 8.5-11H13V3z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3M12 13v4M8.5 20h7M10 17h4"/>'
};
const PKIND = {PROT:'shield', PU:'star', RIC:'heart', DNA:'bolt', WEL:'sun'};
const STAGES = ['Calcolo provvigione…','Verifica in amministrazione…','Attesa del timbro giusto…','Provvigione in liquidazione. Data: mistero.'];
let lastJoke = '', partyTimers = [];
/* animazione nuovo contatto */
const WJOKES = ['Un altro nome nel Master: la rubrica ringrazia.','Ciao ciao timidezza, benvenuto nel Master!','Un contatto in più, un caffè in più da offrire.','Il Master cresce: più nomi, più occasioni.','Ora sa che esisti. Il resto è simpatia.','Nuovo arrivato! Ricordati di salutarlo davvero.','Un contatto oggi, un cliente domani (forse, ma ci crediamo).'];
const WJOKES_CLI = ['Cliente nuovo: il portafoglio sorride!','Un cliente in più, un sorriso in più.','Benvenuto in famiglia: ora sì che si lavora!'];
let lastWJ = '';
function welcomeContact(c){
  closeParty();
  const cli = c.c==='Clienti' || c.s===2, pool = cli ? WJOKES_CLI : WJOKES;
  let msg; do{ msg = pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1 && msg===lastWJ); lastWJ = msg;
  const ini = (c.n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
  const em = cli ? ['🤝','💶','✨','🎉'] : ['👋','😄','✨','🎉','💌'];
  let rain = '';
  for(let i=0;i<22;i++){ const st = `left:${(Math.random()*94).toFixed(1)}%;animation-duration:${(2.8+Math.random()*2).toFixed(2)}s;animation-delay:${(Math.random()*1.2).toFixed(2)}s;--sw:${Math.round(Math.random()*80-40)}px`; rain += `<span class="mon emo" style="${st}">${em[i%em.length]}</span>`; }
  const el = document.createElement('div'); el.id = 'party'; el.setAttribute('role','status');
  el.innerHTML = `${rain}<div class="pcard"><div class="pbadge wave${cli?' sun':''}"><b>${esc(ini)}</b><i class="hand" aria-hidden="true">${cli?'🤝':'👋'}</i></div>
    <h2>${cli?'Nuovo cliente!':'Nuovo contatto!'}</h2><p class="pmsg"><b>${esc(c.n)}</b> è entrato nel Master.<br>${msg}</p>
    <div class="pnum">Ora il Master conta <b>${contacts.length}</b> ${contacts.length===1?'persona':'persone'}</div>
    <button class="btn primary" id="partyOk" type="button" style="width:100%;margin-top:6px">Evviva!</button></div>`;
  document.body.appendChild(el); el.onclick = closeParty;
  partyTimers.push(setTimeout(closeParty, 5500));
}

function closeParty(){ partyTimers.forEach(clearTimeout); partyTimers = []; const p = document.getElementById('party'); if(p) p.remove(); }
function celebrate(rec){
  closeParty();
  const neg = rec.v < 0, big = !neg && rec.v >= 5000;
  const pool = neg ? JOKES.neg : [].concat(JOKES[rec.k]||[], JOKES[rec.k]||[], JOKES.general, big ? JOKES.big : []);
  let msg; do{ msg = pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1 && msg===lastJoke);
  lastJoke = msg;
  const icon = neg ? 'sun' : (big ? 'trophy' : PKIND[rec.k] || 'star');
  const net = rec.v * fat.coef[rec.k];
  const ape = GROUPS.reduce((s,g)=>s+gNet(g,mths('all')),0);
  const goal = fat.apeAnno > 0 ? ` · obiettivo annuo al ${fmt(pct(ape,fat.apeAnno))}%` : '';
  const stipLine = (rec.y===fat.anno && stipOk()) ? `<br>Stipendio stimato di ${nextLabel(rec.m).toLowerCase()}: <b>${eur(stipTot(rec.m))}</b>` : '';
  const extra = rec.y!==fat.anno ? `<br>La data è di un altro anno: non conta nei totali ${fat.anno}.` : '';
  let mon = '';
  if(!neg) for(let i=0;i<30;i++){
    const st = `left:${(Math.random()*96).toFixed(1)}%;animation-duration:${(2.6+Math.random()*2).toFixed(2)}s;animation-delay:${(Math.random()*1.4).toFixed(2)}s;--sw:${Math.round(Math.random()*80-40)}px`;
    mon += i%3 ? `<span class="mon coin" style="${st}">€</span>` : `<span class="mon note" style="${st}"></span>`;
  }
  const el = document.createElement('div'); el.id = 'party'; el.setAttribute('role','status');
  el.innerHTML = `${mon}<div class="pcard"><div class="pbadge${icon==='sun'||icon==='trophy'?' sun':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${PICON[icon]}</svg></div>
    <h2>${neg ? 'Storno registrato' : 'Polizza registrata!'}</h2><p class="pmsg">${msg}</p>
    <div class="pnum">${neg?'':'+'}${eur(rec.v)} lordo · ${eur(net)} di APE netta${goal}${stipLine}${extra}</div>
    ${neg ? '' : `<div class="pprov"><span id="pstage">${STAGES[0]}</span><i></i></div>`}
    <button class="btn primary" id="partyOk" type="button" style="width:100%;margin-top:6px">Avanti</button></div>`;
  document.body.appendChild(el);
  el.onclick = closeParty;
  if(!neg){
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const stage = document.getElementById('pstage');
    if(still) stage.textContent = STAGES[3];
    else [1,2,3].forEach(n=>partyTimers.push(setTimeout(()=>{ if(stage) stage.textContent = STAGES[n]; }, n*1000)));
  }
  partyTimers.push(setTimeout(closeParty, 8000));
}
</script>
<script>
/* ===== STIPENDIO: fisso + provvigioni sulla produzione del mese, pagate il mese dopo ===== */
let stipM = null;
const provRows = m => POLK.map(([k,n])=>{ const net = netM(k,m), rate = +fat.stip.rate[k] || 0; return {k,n,net,rate,prov:net*rate/100}; });
const stipDa = () => +fat.stip.da || 0;
const provTot = m => m < stipDa() ? 0 : provRows(m).reduce((s,r)=>s+r.prov,0);
const prevTot = m => (m >= stipDa() && m < 11) ? (+fat.stip.prec || 0) : 0;
const stipTot = m => (+fat.stip.fisso || 0) + provTot(m) + prevTot(m);
const nextLabel = m => m===11 ? `${MESI[0]} ${fat.anno+1}` : MESI[m+1];
const stipOk = () => (+fat.stip.fisso || 0) > 0 || Object.values(fat.stip.rate).some(r=>+r>0);

function renderStip(){
  $('count').textContent = String(fat.anno);
  const now = new Date(), curY = now.getFullYear()===fat.anno, cur = curY ? now.getMonth() : 11;
  if(stipM===null) stipM = cur;
  const m = stipM, rows = provRows(m), old = m < stipDa(), pt = provTot(m), pv = prevTot(m), fisso = +fat.stip.fisso || 0, tot = fisso + pt + pv;
  const quip = old ? `Prima di ${MESI[stipDa()].toLowerCase()} le provvigioni erano pagate in modo diverso: qui conta solo il fisso.` : !stipOk() ? 'Imposta il fisso e le percentuali da “Compensi” per vedere la stima.'
    : pt===0 ? 'Per ora solo il fisso. Le polizze non si fanno da sole.'
    : pt<500 ? 'Si comincia a sentire il profumo della provvigione.'
    : pt<1500 ? 'Il mese prende una bella piega.'
    : 'Con questi numeri il bollo dell’auto non fa più paura.';
  let h = `<div class="sumwrap">
  <div class="chips" id="stipChips">${MESI.map((n,i)=>`<button type="button" class="chip" data-sm="${i}" aria-pressed="${i===m}">${nextLabel(i).slice(0,3)}</button>`).join('')}</div>
  <p class="hint" style="margin:-2px 0 0;text-align:center">Scegli il mese in cui ricevi lo stipendio: si calcola sulle polizze del mese prima.</p>
  <div class="card"><div class="sechead"><div class="fieldname" style="margin:0">Stipendio di ${nextLabel(m).toLowerCase()}</div><button class="icon-btn" id="stipSet" type="button">Compensi</button></div>
    <div class="big">${eur(tot)}</div>
    <div class="ds">Fisso ${eur(fisso)} + provvigioni ${eur(pt)}${pv?` + provvigioni precedenti ${eur(pv)}`:''} sulle polizze di ${MESI[m].toLowerCase()}</div>
    <p class="hint" style="margin:8px 0 0"><i>${quip}</i></p>
    <div class="qcells" style="grid-template-columns:repeat(${pv?2:3},1fr);margin-top:12px">
      <div class="qc"><span>Fisso</span><b>${eur(fisso)}</b></div>
      <div class="qc"><span>Provvigioni</span><b>${eur(pt)}</b></div>
      ${pv?`<div class="qc"><span>Provvigioni precedenti</span><b>${eur(pv)}</b></div>`:''}
      <div class="qc"><span>Stipendio di ${MESI[m].slice(0,3).toLowerCase()}</span><b>${m>0 ? eur(stipTot(m-1)) : '–'}</b></div></div>
    ${m<11 ? `<p class="hint" style="margin:10px 0 0">Ogni mese si riparte da zero: le polizze di ${MESI[m+1].toLowerCase()} faranno lo stipendio di ${nextLabel(m+1).toLowerCase()}.</p>` : ''}</div>`;

  h += `<div class="card"><h3>Come si calcola</h3><p class="hint">Percentuale sull’APE netta di ${MESI[m].toLowerCase()}.</p>`;
  for(const r of rows){
    h += `<div class="kv"><span>${r.n} · ${r.rate>0 && !old ? numStr(r.rate)+'% su '+eur(r.net) : (old ? 'vecchio sistema' : 'non prevista')}</span><b>${eur(old ? 0 : r.prov)}</b></div>`;
  }
  h += `<div class="kv"><span>Fisso</span><b>${eur(fisso)}</b></div>${pv?`<div class="kv"><span>Provvigioni precedenti</span><b>${eur(pv)}</b></div>`:''}<div class="kv"><span><b>Stipendio stimato di ${nextLabel(m).toLowerCase()}</b></span><b>${eur(tot)}</b></div></div>`;

  const lastReal = curY ? now.getMonth() : 11;
  h += `<div class="card"><h3>Tutti i mesi</h3><p class="hint">Ogni riga è lo stipendio di un mese, calcolato sulle polizze del mese prima.</p><div class="tw"><table><thead><tr><th>Stipendio di</th><th>APE netta</th><th>Provv.</th><th>Prec.</th><th>Stipendio</th></tr></thead><tbody>`;
  let sumP = 0, sumS = 0;
  for(let i=0;i<12;i++){
    const future = i > lastReal, net = POLK.reduce((s,[k])=>s+netM(k,i),0), p = provTot(i), pr = prevTot(i), st = stipTot(i);
    if(!future){ sumP += p; sumS += st; }
    h += `<tr data-sm="${i}" class="${i===m?'sel':''}"><td>${nextLabel(i).slice(0,3)} <span class="ds">da ${MESI[i].slice(0,3).toLowerCase()}</span></td><td>${future?'<span class="ds">–</span>':n0(net)}</td><td>${future?'<span class="ds">–</span>':n0(p)}</td><td>${future||!pr?'<span class="ds">–</span>':n0(pr)}</td><td><b>${future?'–':n0(st)}</b></td></tr>`;
  }
  h += `<tr><td><b>Totale</b></td><td></td><td><b>${n0(sumP)}</b></td><td></td><td><b>${n0(sumS)}</b></td></tr></tbody></table></div></div></div>`;
  $('stipendio').innerHTML = h;
}

function openCompensi(){
  const fld = (label,path) => `<label class="f">${label}<input inputmode="decimal" data-path="${path}" value="${esc(numStr(getPath(fat,path)))}"></label>`;
  $('layer').innerHTML = `<div class="scrim" id="scrim"></div>
  <div class="sheet" role="dialog" aria-label="Compensi"><div class="sheet-in">
    <h2>Compensi</h2>
    <div class="grid2">${fld('Fisso mensile (€)','stip.fisso')}<label class="f">Provvigioni calcolate da<select id="stipDa" class="search">${MESI.map((n,i)=>`<option value="${i}"${i===stipDa()?' selected':''}>${n}</option>`).join('')}</select></label></div>
    <div><div class="fieldname">Percentuale sull’APE netta</div><div class="grid2">${fld('Provvigioni precedenti (€/mese)','stip.prec')}</div>
    <div class="hint">Importo fisso aggiunto ogni mese fino a dicembre, dal mese di inizio provvigioni.</div>
    <div class="grid2">${POLK.map(([k,n])=>fld(n+' (%)','stip.rate.'+k)).join('')}</div></div>
    <p class="hint">Le provvigioni di un mese si pagano nel mese dopo. Il welfare ha la sua percentuale: se la tua è uguale a quella del DNA, scrivi lo stesso valore.</p>
    <div class="actions"><button class="btn" id="cancel" type="button">Annulla</button><button class="btn primary" id="ok" type="button">Salva</button></div>
  </div></div>`;
  $('scrim').onclick = $('cancel').onclick = closeLayer;
  $('ok').onclick = ()=>{
    document.querySelectorAll('#layer [data-path]').forEach(i=>setPath(fat,i.dataset.path,num(i.value)));
    fat.stip.da = +$('stipDa').value; saveFat(); closeLayer(); render(); toast('Compensi salvati');
  };
}
$('stipendio').addEventListener('click',e=>{
  if(e.target.closest('#stipSet')) return openCompensi();
  const b = e.target.closest('[data-sm]'); if(b){ stipM = +b.dataset.sm; renderStip(); }
});
</script>
<style>
tr.sel td{background:var(--accent-soft)}
tbody tr[data-sm]{cursor:pointer}
</style>
<style>
/* ===== Rifinitura: scritte centrate, grassetti, schede moderne ===== */
:root{--grad:linear-gradient(135deg,#0fb0b5 0%,#1b8fd6 100%);--grad-sun:linear-gradient(135deg,#ffb23f 0%,#f07a0a 100%);--glow:0 8px 22px rgba(15,150,170,.28)}
body{font-weight:500;letter-spacing:.005em}
b,strong{font-weight:800}
/* intestazione */
.title-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
h1{grid-column:2;grid-row:1;text-align:center;font-size:1.85rem;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(120deg,#07838a,#1b8fd6 55%,#f07a0a);-webkit-background-clip:text;background-clip:text;color:transparent}
.count{grid-column:1;grid-row:1;justify-self:start;font-weight:700}
#openBackup{grid-column:3;grid-row:1;justify-self:end;font-weight:700}
.icon-btn{font-weight:700;border-radius:999px;padding:8px 14px}
/* testi centrati */
.fieldname{text-align:center;color:var(--accent);font-weight:800;letter-spacing:.12em;font-size:.76rem}
.card h3{text-align:center;font-weight:800;font-size:1.12rem;letter-spacing:-.01em}
.card .hint,.card>.ds,.sechead+.big+.ds{text-align:center}

<script>
/* ===== CALENDARIO: appuntamenti Master / CRM / Personali ===== */
const KC = 'master-calendario-v1';
DATA_KEYS.push(KC);
let cal = null, calF = 'all', calPast = false, calPer = 'all';
const CALT = {master:'Master', crm:'CRM', recl:'Reclutamento', aff:'Affiancamento', pers:'Personale', scad:'Rinnovi'};
const CALP = {master:'s1', crm:'l3', recl:'l2', aff:'s2', pers:'l1', scad:'s0'};
const CALC = {master:'var(--accent)', crm:'var(--cli)', recl:'var(--semi)', aff:'var(--ok)', pers:'var(--freddo)', scad:'var(--caldo)'};
function calSumHtml(src,label){
  loadCal(); src = src || cal; const t = todayISO(), tot = src.length, arr = src.filter(a=>a.d>=t).length;
  return `<div class="card"><h3>Riepilogo appuntamenti${label?' · '+label:''}</h3><div class="ds"><b>${tot}</b> in tutto · <b>${arr}</b> in arrivo</div><div class="list" style="margin-top:10px">${Object.entries(CALT).map(([k,n])=>{ const c = src.filter(a=>a.tipo===k), u = c.filter(a=>a.d>=t).length; return `<button class="lvrow" data-cg="${k}" type="button"><div class="lvhead"><span class="pill ${CALP[k]}">${n}</span><span class="lvn"><b>${c.length}</b> totali · ${u} in arrivo</span></div><div class="stack" aria-hidden="true"><i style="width:${tot?c.length/tot*100:0}%;background:${CALC[k]}"></i></div></button>`; }).join('')}</div></div>`;
}
const GIORNI = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
function loadCal(){ if(cal) return; try{ const r = store.get(KC); cal = r ? JSON.parse(r) : []; }catch(e){ cal = []; } if(!Array.isArray(cal)) cal = []; }
function saveCal(){ store.set(KC, JSON.stringify(cal)); }
const dayLabel = iso => { const [y,m,d] = iso.split('-').map(Number), dt = new Date(y,m-1,d); const t = todayISO();
  const tm = new Date(); tm.setDate(tm.getDate()+1); const tmI = tm.getFullYear()+'-'+String(tm.getMonth()+1).padStart(2,'0')+'-'+String(tm.getDate()).padStart(2,'0');
  return (iso===t?'Oggi · ':iso===tmI?'Domani · ':'') + GIORNI[dt.getDay()] + ' ' + d + ' ' + MESI[m-1].toLowerCase(); };
function renderCal(){
  loadCal();
  $('count').textContent = cal.length + (cal.length===1 ? ' appuntamento' : ' appuntamenti');
  const t = todayISO(), nowT = new Date().toTimeString().slice(0,5);
  const Y = new Date().getFullYear(), inP = a => calPer==='all' || (+a.d.slice(0,4)===Y && mths(calPer).includes(+a.d.slice(5,7)-1));
  const base = cal.filter(inP), qSel = calPer==='all' ? -1 : isMonth(calPer) ? Math.floor(+calPer.slice(1)/3) : calPer;
  const plabel = calPer==='all' ? '' : isMonth(calPer) ? MESI[+calPer.slice(1)] + ' ' + Y : (calPer+1) + '° trimestre ' + Y;
  const fl = base.filter(a => calF==='all' || calF.split(',').includes(a.tipo));
  const up = fl.filter(a => calPer!=='all' || a.d >= t).sort((a,b)=>a.d.localeCompare(b.d) || (a.t||'99').localeCompare(b.t||'99'));
  const past = calPer!=='all' ? [] : fl.filter(a => a.d < t).sort((a,b)=>b.d.localeCompare(a.d) || (a.t||'').localeCompare(b.t||''));
  const today = cal.filter(a=>a.d===t).length;
  const next = cal.filter(a=>a.d>t || (a.d===t && (a.t||'99')>=nowT)).sort((a,b)=>(a.d+(a.t||'99')).localeCompare(b.d+(b.t||'99')))[0];
  const item = a => `<button class="item" data-ap="${a.id}" type="button"><div class="name">${a.t?`<span class="aptime">${esc(a.t)}</span> `:''}${esc(a.tit)}</div>${a.note?`<div class="sub">${esc(a.note)}</div>`:'<div class="sub"></div>'}<div class="tags"><span class="pill ${CALP[a.tipo]}">${CALT[a.tipo]}</span></div></button>`;
  const group = arr => { let h='', last=''; for(const a of arr){ if(a.d!==last){ last=a.d; h += `<div class="letter">${dayLabel(a.d)}</div>`; } h += item(a); } return h; };
  let h = `<div class="sumwrap">
  <div class="card" style="padding:12px 14px"><div class="row2"><b>Oggi</b><span class="ds"><b>${today}</b> ${today===1?'appuntamento':'appuntamenti'}</span></div>
    ${next?`<p class="hint" style="margin:6px 0 0"><b>Prossimo:</b> ${esc(next.tit)} · ${dayLabel(next.d)}${next.t?' alle '+esc(next.t):''}</p>`:'<p class="hint" style="margin:6px 0 0">Nessun appuntamento in arrivo.</p>'}</div>
  <div class="chips" id="calF" style="justify-content:center;flex-wrap:wrap">${[['all','Tutti'],['master','Master'],['crm','CRM'],['recl','Reclutamento'],['aff','Affiancamento'],['pers','Personali'],['scad','Rinnovi e scadenze']].map(([v,l])=>{ const n = v==='all' ? base.length : base.filter(a=>a.tipo===v).length; return `<button type="button" class="chip" data-f="${v}" aria-pressed="${v==='all' ? calF==='all' : calF.split(',').includes(v)}">${l}${n?` <b>${n}</b>`:''}</button>`; }).join('')}</div>
  <div class="chips" id="calP" style="justify-content:center;flex-wrap:wrap">${[['all','Tutto'],[0,'1° trim.'],[1,'2° trim.'],[2,'3° trim.'],[3,'4° trim.']].map(([v,l])=>`<button type="button" class="chip" data-pp="${v}" aria-pressed="${calPer===v || (isMonth(calPer) && v===qSel)}">${l}</button>`).join('')}</div>
  ${qSel>=0 ? `<div class="chips" style="justify-content:center;flex-wrap:nowrap">${[0,1,2].map(k=>qSel*3+k).map(i=>`<button type="button" class="chip" data-pp="m${i}" aria-pressed="${calPer==='m'+i}" style="flex:1">${MESI[i]}</button>`).join('')}</div>` : ''}
  <div class="list" style="margin-top:0">${up.length ? group(up) : '<div class="empty">Nessun appuntamento'+(calPer==='all'?'':' in questo periodo')+'.<br>Tocca “+ Appuntamento” per aggiungerne uno.</div>'}</div>`;
  if(past.length){
    h += `<div class="chips" style="justify-content:center"><button type="button" class="chip" id="calPast" aria-pressed="${calPast}">Passati (${past.length})</button></div>`;
    if(calPast) h += `<div class="list" style="margin-top:0">${group(past)}</div>`;
  }
  $('calendario').innerHTML = h + '</div>';
}
function openAppt(id){
  loadCal();
  const ex = id ? cal.find(x=>x.id===id) : null;
  const a = ex ? {...ex} : {id:'a'+Date.now().toString(36), d:todayISO(), t:'', tipo: calF==='all'?'master':calF.split(',')[0], tit:'', note:''};
  const draw = ()=>{
    $('layer').innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-label="Appuntamento"><div class="sheet-in">
      <h2>${ex?'Modifica appuntamento':'Nuovo appuntamento'}</h2>
      <div><div class="fieldname">Tipo</div><div id="at" class="catwrap" style="justify-content:center">${Object.entries(CALT).map(([k,n])=>`<button type="button" class="chip" data-v="${k}" aria-pressed="${a.tipo===k}">${n}</button>`).join('')}</div></div>
      <label class="f" for="atit">Titolo<input id="atit" value="${esc(a.tit)}" autocomplete="off" placeholder="Es. Caffè con Mario"></label>
      <div class="grid2"><label class="f" for="ad">Data<input id="ad" type="date" value="${esc(a.d)}"></label><label class="f" for="ah">Ora<input id="ah" type="time" value="${esc(a.t)}"></label></div>
      <label class="f" for="an">Note<input id="an" value="${esc(a.note)}" autocomplete="off" placeholder="Luogo, argomento…"></label>
      <div class="actions">${ex?`<button class="btn danger" id="del" type="button">${a._c?'Tocca ancora per eliminare':'Elimina'}</button>`:''}<button class="btn" id="cancel" type="button">Annulla</button><button class="btn primary" id="ok" type="button">Salva</button></div>
    </div></div>`;
    const keep = ()=>{ a.tit=$('atit').value.trim(); a.d=$('ad').value; a.t=$('ah').value; a.note=$('an').value.trim(); };
    $('scrim').onclick = $('cancel').onclick = closeLayer;
    $('at').onclick = e=>{ const b=e.target.closest('button'); if(!b) return; keep(); a.tipo=b.dataset.v; draw(); };
    $('ok').onclick = ()=>{
      keep(); if(!a.tit){ $('atit').focus(); toast('Scrivi un titolo'); return; } if(!a.d){ toast('Scegli la data'); return; }
      const {_c, ...rec} = a; if(ex) Object.assign(cal.find(x=>x.id===a.id), rec); else cal.push(rec);
      saveCal(); closeLayer(); render(); toast(ex?'Appuntamento aggiornato':'Appuntamento aggiunto');
    };
    if($('del')) $('del').onclick = ()=>{ if(!a._c){ keep(); a._c=true; draw(); return; } cal = cal.filter(x=>x.id!==a.id); saveCal(); closeLayer(); render(); toast('Appuntamento eliminato'); };
  };
  draw();
}
$('calendario').addEventListener('click',e=>{
  const pp = e.target.closest('[data-pp]'); if(pp){ const v = pp.dataset.pp; calPer = v==='all' ? 'all' : v[0]==='m' ? v : +v; renderCal(); return; }
  const f = e.target.closest('[data-f],[data-cg]'); if(f){ if(f.dataset.f && f.dataset.f!=='all'){ const cur = calF==='all' ? [] : calF.split(','), i = cur.indexOf(f.dataset.f); if(i>=0) cur.splice(i,1); else cur.push(f.dataset.f); calF = cur.length ? cur.join(',') : 'all'; } else calF = f.dataset.f || f.dataset.cg; renderCal(); return; }
  if(e.target.closest('#calPast')){ calPast = !calPast; renderCal(); return; }
  const it = e.target.closest('[data-ap]'); if(it) openAppt(it.dataset.ap);
});
const _rs = renderSummary;
renderSummary = function(){ _rs(); const w = $('summary').querySelector('.sumwrap') || $('summary'); w.insertAdjacentHTML('beforeend', calSumHtml()); };
$('summary').addEventListener('click',e=>{ const b = e.target.closest('[data-cg]'); if(b){ calF = b.dataset.cg; setView('cal'); } });
const _syncView = syncView;
syncView = function(){ _syncView(); $('calendario').hidden = view!=='cal'; if(view==='cal') $('add').textContent = '+ Appuntamento'; };
const _render = render;
render = function(){ if(view==='cal'){ renderCal(); syncView(); } else _render(); };
$('add').addEventListener('click',e=>{ if(view==='cal'){ e.stopImmediatePropagation(); openAppt(null); } },true);
</script>

<script>
/* ===== Backup: promemoria e condivisione ===== */
const LB_KEY = 'vertex-lastbackup';
function lastBk(){ try{ return +localStorage.getItem(LB_KEY) || 0; }catch(e){ return 0; } }
function markBk(){ try{ localStorage.setItem(LB_KEY, String(Date.now())); }catch(e){} updateBk(); }
function backupJson(){ return JSON.stringify({v:2,contatti:contacts,fatturato:fat,portafoglio:port,calendario:(typeof loadCal==='function'&&(loadCal(),cal))||[]}); }
function updateBk(){
  let b = document.getElementById('bkBanner');
  if(!b){ b = document.createElement('button'); b.id = 'bkBanner'; b.type = 'button'; b.hidden = true; b.onclick = () => openBackup(); const top = document.querySelector('.top'); if(top) top.appendChild(b); }
  const has = (typeof contacts!=='undefined' && contacts.length) || (typeof fat!=='undefined' && fat && fat.pol && fat.pol.length) || (typeof port!=='undefined' && port && port.length);
  const t = lastBk(), days = t ? Math.floor((Date.now()-t)/864e5) : null;
  if(!has || (t && days < 7)){ b.hidden = true; return; }
  b.textContent = t ? `Ultimo backup ${days} giorni fa · Fai il backup` : 'Non hai ancora fatto un backup · Fallo ora';
  b.hidden = false;
}
(function(){ const _r = render; render = function(){ _r(); updateBk(); }; })();
document.addEventListener('visibilitychange', () => { if(!document.hidden) updateBk(); });
new MutationObserver(() => {
  const L = document.getElementById('layer');
  const cj = document.getElementById('copyJson');
  if(cj && !document.getElementById('shareJson')){
    cj.addEventListener('click', () => markBk());
    const b = document.createElement('button'); b.className = 'btn'; b.id = 'shareJson'; b.type = 'button'; b.textContent = 'Condividi backup';
    b.onclick = async () => {
      const txt = backupJson(), name = 'Vertex-backup-' + todayISO() + '.json';
      try{
        const f = new File([txt], name, {type:'application/json'});
        if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:'Backup Vertex'}); markBk(); return; }
        if(navigator.share){ await navigator.share({text:txt, title:'Backup Vertex'}); markBk(); return; }
      }catch(e){ if(e && e.name==='AbortError') return; }
      try{ await navigator.clipboard.writeText(txt); markBk(); toast('Backup copiato'); }catch(e){ toast('Usa “Copia backup”'); }
    };
    cj.parentNode.insertBefore(b, cj.nextSibling);
    const rs = document.getElementById('restore');
    if(rs && !document.getElementById('bkFile')){
      const lab = document.createElement('label'); lab.className = 'f'; lab.innerHTML = 'Oppure carica un file di backup<input id="bkFile" type="file" accept=".json,.txt,application/json,text/plain">';
      rs.parentNode.parentNode.insertBefore(lab, rs.parentNode.nextSibling);

    }
  }
  /* Salva e aggiungi altro prodotto */
  const ok = document.getElementById('ok');
  if(ok && document.getElementById('zv') && !document.getElementById('del') && !document.getElementById('okMore')){
    const m = document.createElement('button'); m.className = 'btn'; m.id = 'okMore'; m.type = 'button'; m.textContent = 'Salva e aggiungi altro';
    m.onclick = () => {

/* ===== Scadenze e imminenti ===== */
const dayDiff = iso => { if(!iso) return null; const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(iso+'T00:00:00')-t)/864e5); };
const renewDate = c => { const b = c.scad || c.emi; if(!b) return null; const t = new Date(); t.setHours(0,0,0,0); const m = +b.slice(5,7)-1, d = +b.slice(8,10); let r = new Date(t.getFullYear(), m, d); if(r < t) r = new Date(t.getFullYear()+1, m, d); return r.getFullYear()+'-'+String(r.getMonth()+1).padStart(2,'0')+'-'+String(r.getDate()).padStart(2,'0'); };
const hasRenew = c => ['pa','dna','tcm','ltc'].some(k => (c.p && c.p[k]||0) > 0);
const renewDays = c => { if(!hasRenew(c)) return null; const r = renewDate(c); return r ? dayDiff(r) : null; };
const impDays = c => { const a = []; const e = dayDiff(c.emi), s = renewDays(c); if(e!==null && e>=0 && e<=30) a.push(e); if(s!==null && s>=0 && s<=60) a.push(s); return a.length ? Math.min.apply(null,a) : null; };
const scadPill = c => { const d = renewDays(c); if(d===null || d<0 || d>60) return ''; return `<span class="aptime scadpill">${d===0?'rinnovo oggi':d===1?'rinnovo domani':'rinnovo tra '+d+' gg'}</span>`; };

/* ===== Doppioni ===== */
const lev = (a,b) => { const m = [...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p = m[0]; m[0] = i; for(let j=1;j<=b.length;j++){ const t = m[j]; m[j] = Math.min(m[j]+1, m[j-1]+1, p + (a[i-1]===b[j-1]?0:1)); p = t; } } return m[b.length]; };
const similar = (a,b) => { const ka = tokKey(a), kb = tokKey(b); if(!ka || !kb || ka===kb) return false; if(Math.min(ka.length,kb.length) < 6) return false; return lev(ka,kb) <= (Math.min(ka.length,kb.length) < 12 ? 1 : 2); };
const dupIgn = () => { try{ return JSON.parse(localStorage.getItem('vertex-dupign')||'[]'); }catch(e){ return []; } };
function dupPairs(){
  const ign = dupIgn(), out = [];
  for(let i=0;i<port.length;i++) for(let j=i+1;j<port.length;j++){
    const a = pname(port[i]), b = pname(port[j]); if(!a || !b) continue;
    const id = [port[i].id, port[j].id].sort().join('|');
    if(similar(a,b) && !ign.includes(id)) out.push([port[i], port[j], id]);
  }
  return out;
}
function mergeClients(keep, drop){
  PRODS.forEach(([k]) => { keep.p[k] = (keep.p[k]||0) + (drop.p[k]||0); });
  if(!keep.pol && drop.pol) keep.pol = drop.pol;
  if(drop.emi && (!keep.emi || drop.emi < keep.emi)) keep.emi = drop.emi;
  if(drop.scad && (!keep.scad || drop.scad < keep.scad)) keep.scad = drop.scad;
  const kd = tokKey(pname(drop)), nk = pname(keep);
  fat.pol.forEach(p => { if(tokKey(p.cli||'')===kd) p.cli = nk; });
  if(drop.cid && drop.cid !== keep.cid){ contacts = contacts.filter(x => !(x.id===drop.cid && x.c==='Clienti' && !x.note)); save(); }
  port = port.filter(x => x.id !== drop.id);
  savePort(); saveFat();
}
(function(){ const _rp = renderPort; renderPort = function(){ _rp();
  const pairs = dupPairs(), w = document.querySelector('#portafoglio .sumwrap'); if(!pairs.length || !w) return;
  const card = document.createElement('div'); card.className = 'card'; card.id = 'dupCard';
  card.innerHTML = '<h3>Possibili doppioni</h3><p class="hint">Nomi quasi uguali: se sono la stessa persona, uniscili.</p>' + pairs.slice(0,5).map(([a,b,id]) => `<div class="kv"><span>${esc(pname(a))} · ${esc(pname(b))}</span><b><button class="btn" data-merge="${a.id}|${b.id}" type="button">Unisci</button> <button class="btn" data-ign="${id}" type="button">Diversi</button></b></div>`).join('');
  const first = w.querySelector('.card'); w.insertBefore(card, first ? first.nextSibling : w.firstChild);
}; })();
document.getElementById('portafoglio').addEventListener('click', e => {
  const ig = e.target.closest('[data-ign]');
  if(ig){ const l = dupIgn(); l.push(ig.dataset.ign); try{ localStorage.setItem('vertex-dupign', JSON.stringify(l)); }catch(x){} renderPort(); return; }
  const mg = e.target.closest('[data-merge]');
  if(mg){
    if(!mg.dataset.sure){ mg.dataset.sure = '1'; mg.textContent = 'Tocca ancora'; return; }
    const [ia, ib] = mg.dataset.merge.split('|'), A = port.find(x=>x.id===ia), B = port.find(x=>x.id===ib); if(!A || !B) return;
    const ta = PRODS.reduce((s,[k])=>s+(A.p[k]||0),0), tb = PRODS.reduce((s,[k])=>s+(B.p[k]||0),0);
    const keep = tb > ta ? B : A, drop = keep===A ? B : A;
    mergeClients(keep, drop); renderPort(); toast('Clienti uniti');
  }
}, true);
document.addEventListener('input', e => {
  if(!e.target || e.target.id !== 'zc') return;
  let box = document.getElementById('zsugbox');
  if(!box){ box = document.createElement('div'); box.id = 'zsugbox'; const lab = e.target.closest('label'); lab.parentNode.insertBefore(box, lab.nextSibling); }
  const v = e.target.value.trim(); box.innerHTML = '';
  if(v.length < 4) return;
  const s = clientNames().find(n => similar(n, v));
  if(s) box.innerHTML = `<button type="button" class="chip" id="zsug">Forse intendi «${esc(s)}» · usa questo nome</button>`;
});
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('#zsug'); if(!b) return; const z = document.getElementById('zc'); const m = b.textContent.match(/«(.*)»/); if(z && m){ z.value = m[1]; document.getElementById('zsugbox').innerHTML = ''; } });

/* ===== Calendario collegato al Portafoglio ===== */
(function(){
  const vEv = () => { const t = todayISO(), out = [];
    port.forEach(c => { const nm = pname(c) || 'Cliente';
      if(c.emi && c.emi >= t) out.push({id:'v_emi_'+c.id, d:c.emi, t:'', tipo:'scad', tit:'Emissione · '+nm, note:'Dal Portafoglio', virt:1});

.hq button{border:1px solid var(--glass-line);background:var(--glass);border-radius:18px;padding:12px 4px;font-weight:800;display:grid;justify-items:center;gap:6px;font-size:.82rem;color:var(--fg);box-shadow:var(--shade)}
.hq svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hnote{width:100%}
.seclbl{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}
/* grafico mensile */
.mchart{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:132px;margin-top:10px}
.mb{display:grid;grid-template-rows:1fr auto;height:100%;gap:4px;justify-items:center;min-width:0}
.mb .bw{width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.mb .bar{width:100%;border-radius:7px 7px 3px 3px;background:var(--accent);opacity:.55;height:var(--h);transform:scaleY(0);transform-origin:bottom;transition:transform .8s cubic-bezier(.2,.9,.25,1);transition-delay:calc(var(--i)*45ms);min-height:3px}
.mb.cur .bar{opacity:1;background:var(--grad,var(--accent))}
.mchart.go .bar{transform:none}
.mb em{font:700 .56rem/1 var(--font-body);color:var(--muted);font-style:normal;position:absolute;top:-13px;white-space:nowrap}
.mb span{font-size:.64rem;font-weight:800;color:var(--muted)}
.mb.cur span{color:var(--accent)}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.goal .ring{width:84px;height:84px}
/* avatar */
#list .item[data-id]{position:relative;padding-left:66px;grid-template-columns:1fr!important}
#list .item[data-id] .tags{grid-column:1!important;grid-row:2!important;justify-self:start;margin-top:2px}
#list .item[data-id] .name{grid-column:1!important;grid-row:1!important;overflow-wrap:break-word}
#list .item[data-id] .sub{grid-column:1!important;grid-row:3!important}
.av{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:800 .92rem/1 var(--font-display);color:#fff;background:linear-gradient(135deg,var(--freddo),#5aa2ff);box-shadow:0 4px 10px rgba(0,0,0,.14);border:0;padding:0;transition:transform .15s}
.av:active{transform:translateY(-50%) scale(.9)}
.av.l2{background:linear-gradient(135deg,#e0a21b,#f2c14e)}
.av.l3{background:linear-gradient(135deg,#d23c26,#ff7a45)}
.av .ck{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--ok);display:grid;place-items:center;border:2px solid var(--surface)}
.av .ck svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
/* scheda + ricerca */
.sch{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.sch .av{position:static;transform:none;width:64px;height:64px;font-size:1.4rem}
.sch h2{margin:0;font:800 1.35rem/1.15 var(--font-display)}
.sch .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cta2 a{text-decoration:none;text-align:center}
.plr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.plr:first-child{border-top:0}.plr small{color:var(--muted)}
.gsr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 4px;border-top:1px solid var(--line);color:inherit;font:inherit}
.gsr small{color:var(--muted);grid-column:1}
.gsg{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:12px 0 2px}
.hin{width:100%;max-width:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;text-align:right;color:var(--fg)}
.diff.up{color:var(--ok)}.diff.dn{color:var(--caldo)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):root:root{--bg:#150d10;--surface:rgba(40,25,30,.88);--fg:#f6ecee;--muted:#b9a0a7;--line:rgba(255,255,255,.13);--accent:#ff5a5f;--accent-fg:#fff;--accent-soft:#ff5a5f26;--glass:rgba(40,25,30,.72);--glass-line:rgba(255,255,255,.10);--glass-strong:rgba(21,13,16,.94);--sheet:#24161b;--cli:#9bb2ff;color-scheme:dark}
:root:not([data-theme="light"]) :is(h1,.title-row h1.brand){color:#ff5a5f!important}
:root:not([data-theme="light"]) :is(.fieldname,.letter,th){color:#ff7a7e!important}
:root:not([data-theme="light"]) :is(.top,#tabs){background:rgba(21,13,16,.94)!important}
:root:not([data-theme="light"]) .segs{background:rgba(255,90,95,.14)!important}:root:not([data-theme="light"]) .segs button[aria-pressed="true"]{background:#3a2429!important;color:#fff!important}
:root:not([data-theme="light"]) .btn:not(.primary){background:var(--surface)!important;color:var(--fg)!important}
:root:not([data-theme="light"]) .toast{background:#f6ecee;color:#150d10}}
:root[data-theme="dark"]:root{--bg:#150d10;--surface:rgba(40,25,30,.88);--fg:#f6ecee;--muted:#b9a0a7;--line:rgba(255,255,255,.13);--accent:#ff5a5f;--accent-fg:#fff;--accent-soft:#ff5a5f26;--glass:rgba(40,25,30,.72);--glass-line:rgba(255,255,255,.10);--glass-strong:rgba(21,13,16,.94);--sheet:#24161b;--cli:#9bb2ff;color-scheme:dark}
:root[data-theme="dark"] :is(h1,.title-row h1.brand){color:#ff5a5f!important}
:root[data-theme="dark"] :is(.fieldname,.letter,th){color:#ff7a7e!important}
:root[data-theme="dark"] :is(.top,#tabs){background:rgba(21,13,16,.94)!important}
:root[data-theme="dark"] .segs{background:rgba(255,90,95,.14)!important}:root[data-theme="dark"] .segs button[aria-pressed="true"]{background:#3a2429!important;color:#fff!important}
:root[data-theme="dark"] .btn:not(.primary){background:var(--surface)!important;color:var(--fg)!important}
:root[data-theme="dark"] .toast{background:#f6ecee;color:#150d10}
.sch h2{text-align:left}
@media (prefers-reduced-motion:reduce){#splash svg,#splash b,#splash i::after,.vin,.vin .vst,.sheet,.scrim{animation:none!important}.mb .bar{transition:none;transform:none}.ring .pg{transition:none}}
</style>
<script>
(function(){
const $ = id => document.getElementById(id);
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const nkey = s => norm(s).split(' ').sort().join(' ');
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms||8); }catch(e){} };
const ico = {
  home:'<path d="M3 11l9-7.5L21 11"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/>',
  doc:'<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
  theme:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  auto:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>'
};
const svg = (n,c) => `<svg viewBox="0 0 24 24" aria-hidden="true"${c?` class="${c}"`:''}>${ico[n]}</svg>`;

/* ---------- splash ---------- */
const sp = $('splash');
if(sp){ const hide = ()=>{ sp.classList.add('out'); setTimeout(()=>sp.remove(),600); }; const t0 = performance.now(); const go = ()=>setTimeout(hide, Math.max(0,1300-(performance.now()-t0))); if(document.readyState==='complete') go(); else addEventListener('load',go); setTimeout(hide,3500); }

/* ---------- tema ---------- */
const TH = ['auto','light','dark'];
const getTh = () => { try{ return localStorage.getItem('vx-theme')||'auto'; }catch(e){ return 'auto'; } };
const applyTh = t => { const r = document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t); };
const thIcon = t => t==='dark' ? 'moon' : t==='light' ? 'theme' : 'auto';
applyTh(getTh());

/* ---------- barra alta: ricerca + tema ---------- */
const tr = document.querySelector('.title-row'), bk = $('openBackup');
if(tr && bk){
  const sb = document.createElement('button'); sb.className = 'icon-btn ibtn'; sb.id = 'gsBtn'; sb.type = 'button'; sb.setAttribute('aria-label','Cerca ovunque'); sb.innerHTML = svg('search');
  const tb = document.createElement('button'); tb.className = 'icon-btn ibtn'; tb.id = 'thBtn'; tb.type = 'button'; tb.setAttribute('aria-label','Tema'); tb.innerHTML = svg(thIcon(getTh()));
  tr.insertBefore(tb, bk); tr.insertBefore(sb, tb);
  sb.onclick = () => { buzz(); openSearch(); };
  tb.onclick = () => { const n = TH[(TH.indexOf(getTh())+1)%3]; try{ localStorage.setItem('vx-theme',n); }catch(e){} applyTh(n); tb.innerHTML = svg(thIcon(n)); buzz(); toast(n==='auto'?'Tema: automatico':n==='dark'?'Tema scuro':'Tema chiaro'); };
}
const tabSum = document.querySelector('#tabs [data-tab=sum]');
if(tabSum){ tabSum.innerHTML = svg('home') + 'Home'; }

/* ---------- animazioni di vista ---------- */
let animNext = true;
const SECS = ['summary','list','fatturato','portafoglio','stipendio','calendario'];
const countUp = el => {
  const m = el.textContent.trim().match(/^([−-]?)([\d.]+)(?:,(\d+))?\s*€$/); if(!m) return;
  const dec = m[3] ? m[3].length : 0, end = parseFloat(m[2].replace(/\./g,'') + (m[3]?'.'+m[3]:'')) * (m[1]?-1:1), t0 = performance.now(), fin = el.textContent;
  const step = t => { const k = Math.min(1,(t-t0)/800), e = 1-Math.pow(1-k,3), v = end*e; el.textContent = (v<0?'−':'') + Math.abs(v).toLocaleString('it-IT',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + ' €'; if(k<1) requestAnimationFrame(step); else el.textContent = fin; };
  requestAnimationFrame(step);
};
const animateView = () => {
  const sec = SECS.map($).find(s=>s && !s.hidden); if(!sec) return;
  const kids = sec.classList.contains('list') ? [...sec.children] : [...(sec.querySelector('.sumwrap')||sec).children];
  kids.slice(0,14).forEach((k,i)=>{ k.classList.add('vst'); k.style.setProperty('--i',i); });
  sec.classList.remove('vin'); void sec.offsetWidth; sec.classList.add('vin');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) (window.numAnim||function(){})(sec);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ sec.querySelectorAll('.mchart').forEach(c=>c.classList.add('go')); sec.querySelectorAll('.ring .pg').forEach(c=>c.style.strokeDashoffset = c.dataset.off); }));
};
const _sv = setView; setView = function(v){ animNext = true; _sv(v); animateView(); buzz(6); };

/* ---------- Home ---------- */
const sal = () => { const h = new Date().getHours(); return h<12 ? 'Buongiorno' : h<18 ? 'Buon pomeriggio' : 'Buonasera'; };
const ringSvg = (p,label) => { const C = 2*Math.PI*40, off = C*(1-Math.min(1,p)); return `<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="${label}"><circle class="tr" cx="50" cy="50" r="40"/><circle class="pg" cx="50" cy="50" r="40" transform="rotate(-90 50 50)" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${off.toFixed(1)}"/><text x="50" y="51">${Math.round(p*100)}%</text></svg>`; };
const apeTot = () => { try{ return GROUPS.reduce((s,g)=>s+gNet(g,mths('all')),0); }catch(e){ return 0; } };
const renewList = () => port.filter(c=>typeof renewDays==='function' && renewDays(c)!==null && renewDays(c)<=60).map(c=>({c,d:renewDays(c),r:renewDate(c)})).sort((a,b)=>a.d-b.d);
const dmy = iso => iso.slice(8,10)+'/'+iso.slice(5,7);
const homeHtml = () => {
  loadCal(); const t = todayISO();
  const today = cal.filter(a=>a.d===t).sort((a,b)=>(a.t||'99').localeCompare(b.t||'99'));
  const ape = apeTot(), goal = +fat.apeAnno||0, ren = renewList(), emi = port.filter(c=>{ const d = dayDiff(c.emi); return d!==null && d>=0 && d<=30; }).sort((a,b)=>a.emi.localeCompare(b.emi));
  const d = new Date(), dl = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'][d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()].toLowerCase();
  let h = `<div class="hhead"><small>${dl}</small><h2>${sal()}!</h2></div>
  <div class="hgrid">
    <div class="card hbox"><span class="lbl">Oggi</span><span class="big2">${today.length}</span><p>${today.length===1?'appuntamento':'appuntamenti'}${today[0]?`<br><b>${esc(today[0].t?today[0].t+' · ':'')+esc(today[0].tit)}</b>`:'<br>Giornata libera.'}</p></div>
    <div class="card hbox"><span class="lbl">Obiettivo APE</span>${goal>0?ringSvg(ape/goal,'Obiettivo APE'):'<span class="big2">'+eur(ape)+'</span>'}<p style="text-align:center">${goal>0?eur(ape)+' su '+eur(goal):'APE netta '+fat.anno}</p></div>
  </div>
  <div class="card"><div class="fieldname">Rinnovi nei prossimi 60 giorni</div>${ren.length?ren.slice(0,4).map(x=>`<button class="hrow" data-hcli="${x.c.id}" type="button"><b>${esc(pname(x.c)||'Cliente')}</b><span class="aptime scadpill">${x.d===0?'oggi':x.d===1?'domani':'tra '+x.d+' gg'}</span><small>Rinnovo ${dmy(x.r)}</small></button>`).join('')+(ren.length>4?`<p class="hint" style="margin:6px 0 0">e altri ${ren.length-4} in Portafoglio</p>`:''):'<p class="hint">Nessun rinnovo in vista. Tutto tranquillo.</p>'}</div>
  ${emi.length?`<div class="card"><div class="fieldname">Emissioni in arrivo (30 gg)</div>${emi.slice(0,3).map(c=>`<button class="hrow" data-hcli="${c.id}" type="button"><b>${esc(pname(c)||'Cliente')}</b><span class="aptime">${dmy(c.emi)}</span><small>Emissione</small></button>`).join('')}</div>`:''}
  <div class="hq"><button type="button" data-hq="contact">${svg('user')}Contatto</button><button type="button" data-hq="pol">${svg('doc')}Polizza</button><button type="button" data-hq="search">${svg('search')}Cerca</button></div>`;
  if('Notification' in window && Notification.permission==='default') h += `<button class="btn hnote" data-hq="notif" type="button">Attiva i promemoria dei rinnovi</button>`;
  return h + `<div class="seclbl">Il tuo Master</div>`;
};
const _rs = renderSummary; renderSummary = function(){ _rs(); const w = document.querySelector('#summary .sumwrap'); if(w) w.insertAdjacentHTML('afterbegin', homeHtml()); remindOnce(); };
$('summary').addEventListener('click', e => {
  const r = e.target.closest('[data-hcli]'); if(r){ buzz(); openCliente(r.dataset.hcli); return; }
  const q = e.target.closest('[data-hq]'); if(!q) return; buzz();
  const k = q.dataset.hq;
  if(k==='contact') openSheet(); else if(k==='pol'){ setView('fat'); openPolizza(); } else if(k==='search') openSearch();
  else if(k==='notif') Notification.requestPermission().then(p=>{ toast(p==='granted'?'Promemoria attivi':'Promemoria non attivati'); renderSummary(); remindOnce(true); });
});

/* ---------- promemoria ---------- */
let remDone = false;
function remindOnce(force){
  if(remDone && !force) return; if(!port.length && !force) return; remDone = true;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  let seen = {}; try{ seen = JSON.parse(localStorage.getItem('vx-rem')||'{}'); }catch(e){}
  const out = [];
  renewList().forEach(x=>{ const ms = [60,30,14,7,0].filter(m=>x.d<=m).pop(); if(ms===undefined) return; const key = x.c.id+'|'+x.r+'|'+ms; if(seen[key]) return; seen[key] = 1; out.push((pname(x.c)||'Cliente')+' '+(x.d===0?'oggi':'tra '+x.d+' gg')); });
  loadCal(); const nt = cal.filter(a=>a.d===todayISO()).length;
  const bits = []; if(out.length) bits.push('Rinnovi: '+out.slice(0,4).join(', ')+(out.length>4?' e altri '+(out.length-4):'')); if(nt){ const k = 'ap|'+todayISO(); if(!seen[k]){ seen[k] = 1; bits.push(nt+' '+(nt===1?'appuntamento':'appuntamenti')+' oggi'); } }
  if(!bits.length) return;
  try{ localStorage.setItem('vx-rem', JSON.stringify(seen)); }catch(e){}
  const opt = {body:bits.join(' · '), icon:'icon-192.png', tag:'vertex-rem'};
  if(navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r=>r.showNotification('Vertex',opt)).catch(()=>{ try{ new Notification('Vertex',opt); }catch(e){} }); else { try{ new Notification('Vertex',opt); }catch(e){} }
}

/* ---------- Fatturato: andamento mensile + obiettivo ---------- */
const _rf = renderFat; renderFat = function(){
  _rf();
  try{
    if(typeof fatTab!=='undefined' && fatTab!=='prod') return;
    const sec = $('fatturato'), hero = sec.querySelector('.sumwrap > .card'); if(!hero) return;
    const vals = MESI.map((_,i)=>POLK.reduce((s,[k])=>s+netM(k,i),0)), mx = Math.max.apply(null,vals), now = new Date(), cm = now.getFullYear()===fat.anno ? now.getMonth() : -1, tot = vals.reduce((a,b)=>a+b,0), goal = +fat.apeAnno||0;
    const kf = v => v>=1000 ? (v/1000).toFixed(v>=10000?0:1).replace('.',',')+'k' : String(Math.round(v));
    const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `<div class="fieldname">Andamento mensile · APE netta</div>
      ${goal>0?`<div class="goal">${ringSvg(tot/goal,'Obiettivo annuo')}<div><b style="font:800 1.25rem var(--font-display)">${eur(tot)}</b><p class="hint" style="margin:2px 0 0">su ${eur(goal)} di obiettivo annuo${tot<goal?'<br>mancano <b>'+eur(goal-tot)+'</b>':'<br><b>Obiettivo raggiunto!</b>'}</p></div></div>`:''}
      <div class="mchart" aria-label="APE netta per mese">${vals.map((v,i)=>`<div class="mb${i===cm?' cur':''}"><div class="bw"><div class="bar" style="--h:${mx?Math.max(v/mx*100,v>0?4:0):0}%;--i:${i}"></div>${v>0&&(i===cm||v===mx)?`<em>${kf(v)}</em>`:''}</div><span>${MESI[i][0]}</span></div>`).join('')}</div>`;
    hero.insertAdjacentElement('afterend', el);
    if(!animNext){ el.querySelectorAll('.ring .pg').forEach(c=>c.style.strokeDashoffset=c.dataset.off); el.querySelector('.mchart').classList.add('go'); }
  }catch(e){}
};

/* ---------- avatar in Master ---------- */
const ini = n => String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
const _rl = renderList; renderList = function(){
  _rl();
  document.querySelectorAll('#list .item[data-id]').forEach(it=>{
    const c = contacts.find(x=>x.id===it.dataset.id); if(!c) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'av l'+c.l; b.dataset.av = c.id; b.setAttribute('aria-label','Scheda di '+c.n);
    b.innerHTML = esc(ini(c.n)) + (c.s===2 ? `<span class="ck">${svg('check')}</span>` : '');
    it.insertBefore(b, it.firstChild);
  });
};
$('list').addEventListener('click', e => { const a = e.target.closest('[data-av]'); if(a){ e.stopImmediatePropagation(); e.preventDefault(); buzz(); openScheda(a.dataset.av); } }, true);

/* ---------- scheda contatto ---------- */
function openScheda(id){
  const c = contacts.find(x=>x.id===id); if(!c) return;
  loadCal();
  const k = nkey(c.n), pols = port.filter(p=>p.cid===c.id || nkey(pname(p))===k), nl = norm(c.n);
  const aps = cal.filter(a=>norm(a.tit).includes(nl) && a.d>=todayISO()).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,4);
  const wa = t => { let d = String(t||'').replace(/\D/g,''); if(d.startsWith('00')) d = d.slice(2); else if(d.length===10 && d[0]==='3') d = '39'+d; return d; };
  const PN = {pu:'P.U.',pa:'P.A.',dna:'DNA',tcm:'TCM',ltc:'LTC'};
  const draw = () => {
    $('layer').innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-label="Scheda contatto"><div class="sheet-in">
      <div class="sch"><span class="av l${c.l}" style="position:static">${esc(ini(c.n))}</span><div><h2>${esc(c.n)}</h2><div class="tags"><span class="pill l${c.l}">${LV[c.l]}</span><span class="pill s${c.s}">${ST[c.s]}</span>${c.c?`<span class="pill">${esc(c.c)}</span>`:''}</div></div></div>
      <label class="f" for="stel">Telefono<input id="stel" type="tel" inputmode="tel" placeholder="Es. 333 1234567" value="${esc(c.tel||'')}" autocomplete="off"></label>
      <div class="cta2"><a class="btn" id="scall" href="tel:${esc(String(c.tel||'').replace(/[^\d+]/g,''))}" ${c.tel?'':'aria-disabled="true" style="opacity:.45;pointer-events:none"'}>Chiama</a><a class="btn primary" id="swa" href="https://wa.me/${wa(c.tel)}" target="_blank" rel="noopener" ${c.tel?'':'aria-disabled="true" style="opacity:.45;pointer-events:none"'}>WhatsApp</a></div>
      ${c.note?`<div><div class="fieldname">Note</div><p class="hint" style="color:var(--fg)">${esc(c.note)}</p></div>`:''}

.vx-in{animation:vtab .42s cubic-bezier(.2,.9,.3,1)}
/* barre e anelli che si riempiono */
@keyframes vgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vgrowy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.stack i,.ob-bar i,.bar i{transform-origin:left center;animation:vgrow .9s cubic-bezier(.2,.9,.3,1) both}
.ob-hist i{transform-origin:bottom center;animation:vgrowy .8s cubic-bezier(.2,.9,.3,1) both}
.ob-hist>div:nth-child(2) i{animation-delay:60ms}.ob-hist>div:nth-child(3) i{animation-delay:120ms}.ob-hist>div:nth-child(4) i{animation-delay:180ms}.ob-hist>div:nth-child(5) i{animation-delay:240ms}.ob-hist>div:nth-child(6) i{animation-delay:300ms}
/* riflesso sulla carta principale */
.hbox.apeh{position:relative;overflow:hidden}
.hbox.apeh::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-18deg);animation:vshine 2.2s .7s ease 1 both;pointer-events:none}
@keyframes vshine{from{left:-70%}to{left:150%}}
/* icona del tab attivo */
@keyframes vtabpop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
#tabs button[aria-pressed="true"] svg{animation:vtabpop .45s cubic-bezier(.3,1.6,.5,1)}
/* pulsante principale che respira */
@keyframes vbreath{0%,100%{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}50%{box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 55%,transparent)}}
.fab{animation:vbreath 3.6s ease-in-out infinite}
/* avvisi */
@keyframes vtoast{from{opacity:0;transform:translate(-50%,16px) scale(.94)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast{animation:vtoast .35s cubic-bezier(.2,1.2,.3,1);backdrop-filter:blur(10px)}
/* scheda: maniglia */
.sheet::before{content:"";display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
/* onda al tocco */
.vx-rpw{position:relative;overflow:hidden}
.vx-rp{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.18;transform:scale(0);animation:vrp .55s ease-out forwards}
@keyframes vrp{to{transform:scale(1);opacity:0}}
/* comparsa allo scorrimento */
html.vx-io .vx-rv{opacity:0;transform:translateY(16px)}
html.vx-io .vx-rv.vx-vis{opacity:1;transform:none;transition:opacity .5s ease,transform .55s cubic-bezier(.2,.9,.3,1)}
/* cambio tema morbido */
html.vx-tt *,html.vx-tt *::before{transition:background-color .4s,color .4s,border-color .4s,fill .4s,stroke .4s!important}
@media (prefers-reduced-motion:reduce){body::after,.vx-in,.stack i,.ob-bar i,.ob-hist i,.hbox.apeh::after,#tabs button svg,.fab,.toast,.vx-rp{animation:none!important}html.vx-io .vx-rv{opacity:1;transform:none}}
</style>
<script id="vx14js">(function(){
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

let last = null;
const _sv14 = syncView;
syncView = function(){
  _sv14();
  try{ if(view!==last){ const el = document.getElementById(ids[view]); if(el && last!==null && !RM){ el.classList.remove('vx-in'); void el.offsetWidth; el.classList.add('vx-in'); } last = view; } }catch(_){}
};
/* onda al tocco */
document.addEventListener('pointerdown', e => {
  if(RM) return; const t = e.target.closest && e.target.closest('.btn,.chip,.hq button,.ob-ok,.rb,.icon-btn,.look button'); if(!t) return;

/* cambio tema morbido */
document.addEventListener('click', e => { if(e.target.closest && e.target.closest('#thBtn')){ const h = document.documentElement; h.classList.add('vx-tt'); setTimeout(()=>h.classList.remove('vx-tt'),500); } }, true);
})();
</script>
